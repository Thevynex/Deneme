name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Install SDK, test, lint and build
        run: |
          set -o pipefail
          {
            export ANDROID_HOME="$RUNNER_TEMP/thermal-android-sdk"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$RUNNER_TEMP/android-tools.zip" &&
            echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/android-tools.zip" | sha256sum --check &&
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools" &&
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" &&
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" &&
            printf 'y\n%.0s' {1..100} | sdkmanager --licenses > /dev/null &&
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0' &&
            bash scripts/test.sh &&
            gradle --no-daemon :app:lintDebug :app:assembleDebug
          } 2>&1 | tee build.log
      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.log')
          text = '\n'.join(p.read_text(errors='replace').splitlines()[-45:]) if p.exists() else 'Runner setup failed before build. Inspect the setup steps.'
          text = text[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build details::' + text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Isi-Dedektifi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
