name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Install SDK, test, lint and build
        run: |
          set -o pipefail
          {
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0' &&
            bash scripts/test.sh &&
            gradle --no-daemon :app:lintDebug :app:assembleDebug
          } 2>&1 | tee build.log
      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.log')
          text = '\n'.join(p.read_text(errors='replace').splitlines()[-45:]) if p.exists() else 'Runner setup failed before build. Inspect the setup steps.'
          text = text[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build details::' + text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Isi-Dedektifi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
